<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3d Grapher</title>
</head>
<body>
<div style="position: fixed; top: 1px; left: 1px; z-index: 1000; color: white;">
    <span>Equation:</span>
    <input type="number" id="x-coeff" value="1">
    <label for="x-coeff">* x</label>

    <select id="operator">
        <option value="+">+</option>
        <option value="-" selected>-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input type="number" id="y-coeff" value="1">
    <label for="y-coeff">* y</label>

    <span>=</span>

    <input type="number" id="z-coeff" value="1">
    <label for="z-coeff">* z</label>

    <button id="graph-button">Graph</button>
</div>

<a-scene background="color: black">
    <a-entity camera position="0 5 15" look-controls wasd-controls="fly: true"></a-entity>
    <a-light type="ambient" color="#888"></a-light>
    <a-light type="point" intensity="0.7" position="2 10 10"></a-light>
    <a-grid width="20" height="20"></a-grid>
    <a-entity id="graph-container"></a-entity>
</a-scene>
<script src="main.ts" type="module"></script>
</body>
</html>
